<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curb &amp; Zoning Map</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; }
      #app { flex: 1; min-height: 0; }
      #data-banner {
        padding: 6px 12px; text-align: center;
        font: 600 14px system-ui, sans-serif; color: #5c3b00; background: #ffd966;
      }
      #app { position: relative; }
      #reference-note {
        flex: none; padding: 4px 12px; text-align: center; font: 12px system-ui, sans-serif;
        color: #333; background: #f0f0f0; border-top: 1px solid #ccc;
      }
      #reference-note [hidden] { display: none; }
      #data-updated::before { content: " \00b7  "; }
      #legends {
        position: absolute; right: 10px; bottom: 28px; z-index: 1; display: flex; flex-direction: column; align-items: flex-end;
        gap: 6px; max-height: 45%; overflow-y: auto;
      }
      #legends > div {
        padding: 6px 10px; font: 12px system-ui, sans-serif; background: rgba(255, 255, 255, 0.92); border-radius: 4px;
      }
      #legends > div[hidden] { display: none; }
      #layer-toggles {
        position: absolute; left: 10px; top: 10px; z-index: 1; margin: 0; padding: 6px 10px;
        font: 12px system-ui, sans-serif; background: rgba(255, 255, 255, 0.92); border: 0; border-radius: 4px;
      }
      #layer-toggles legend { padding: 0; font-weight: 600; }
      #layer-toggles label { display: block; cursor: pointer; }
      #layer-toggles input { margin: 0 6px 0 0; }
      #zone-filter {
        position: absolute; left: 10px; top: 190px; z-index: 1; padding: 6px 10px;
        font: 12px system-ui, sans-serif; background: rgba(255, 255, 255, 0.92); border-radius: 4px;
      }
      #time-controls {
        position: absolute; left: 50%; top: 10px; z-index: 1; transform: translateX(-50%);
        width: min(440px, calc(100% - 20px)); box-sizing: border-box; padding: 8px 10px;
        font: 12px system-ui, sans-serif; background: rgba(255, 255, 255, 0.95); border-radius: 4px;
      }
      #time-controls .time-readout { display: block; margin-bottom: 6px; font: 600 18px system-ui, sans-serif; }
      #time-controls .day-picker { display: flex; gap: 2px; margin-bottom: 6px; }
      #time-controls .day-picker button { flex: 1; padding: 4px 0; }
      #time-controls button[aria-pressed="true"] { background: #1a73e8; color: #fff; border-color: #1a73e8; }
      #time-controls .mode-picker { display: flex; gap: 2px; margin-bottom: 6px; }
      #time-controls .mode-picker button { flex: 1; padding: 4px 0; min-height: 44px; box-sizing: border-box; }
      #time-controls button:disabled, #time-controls input:disabled { opacity: 0.45; cursor: not-allowed; }
      #time-controls .time-row { display: flex; align-items: center; gap: 8px; }
      #time-controls .time-row input[type="range"] { flex: 1; min-width: 0; }
      #curb-detail {
        position: absolute; right: 10px; top: 110px; z-index: 2; box-sizing: border-box; padding: 8px 12px;
        width: min(340px, calc(100% - 20px)); max-height: calc(100% - 200px); overflow-y: auto;
        font: 12px system-ui, sans-serif; background: rgba(255, 255, 255, 0.97); border-radius: 4px;
      }
      #curb-detail[hidden] { display: none; }
      #curb-detail h2 { margin: 6px 0 2px; font-size: 16px; }
      #curb-detail h3 { margin: 10px 0 2px; font-size: 13px; }
      #curb-detail p { margin: 2px 0; }
      #curb-detail ul { margin: 4px 0 0; padding: 0; list-style: none; }
      #curb-detail .curb-rule { margin: 4px 0; padding: 4px 6px; border-left: 4px solid #bbb; background: #f6f6f6; }
      #curb-detail .curb-rule.active { border-left-color: #1a73e8; background: #e8f0fe; }
      #curb-detail .curb-note { color: #555; }
      #curb-detail .curb-unmapped { font-weight: 600; }
      #day-zones {
        position: absolute; left: 50%; bottom: 28px; z-index: 1; transform: translateX(-50%); box-sizing: border-box; padding: 6px 10px;
        width: min(300px, calc(100% - 20px)); font: 12px system-ui, sans-serif;
        background: rgba(255, 255, 255, 0.95); border-radius: 4px;
      }
      #day-zones summary { cursor: pointer; font-weight: 600; }
      #day-zones ul { margin: 6px 0 0; padding: 0; list-style: none; max-height: 40vh; overflow-y: auto; }
      #day-zones button {
        display: block; width: 100%; padding: 4px 6px; text-align: left; font: inherit; cursor: pointer;
        background: none; border: 0; border-bottom: 1px solid #ddd;
      }
      #day-zones button:hover { background: #e8f0fe; }
      #day-zones button span { display: block; color: #555; }
      #permit-zones-legend {
        position: absolute; left: 10px; top: 190px; z-index: 1; padding: 6px 10px;
        font: 12px system-ui, sans-serif; background: rgba(255, 255, 255, 0.92); border-radius: 4px;
      }
      #permit-zones-legend .swatch {
        display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px;
        border: 1px solid rgba(0, 0, 0, 0.3);
      }
      #legends .swatch {
        display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px;
        border: 1px solid rgba(0, 0, 0, 0.3);
      }

      /* Layout (M5-1). Wide screens: the map fills #app and the controls float over it where they are placed above. */
      #map { position: absolute; inset: 0; }
      #panel { position: absolute; inset: 0; pointer-events: none; }
      #panel * { pointer-events: auto; }
      #controls, #curb-detail-host { display: contents; }
      #panel-toggle { display: none; }
      #permit-zones-legend { top: 236px; }

      /* Touch targets of at least 44 px on phones and any touch screen. */
      @media (max-width: 700px), (pointer: coarse) {
        #panel button, #panel select, #panel summary, #panel input[type="range"] { min-height: 44px; box-sizing: border-box; }
        #panel button { min-width: 44px; font-size: 14px; }
        #panel select { font-size: 16px; }
        #layer-toggles label { display: flex; align-items: center; min-height: 44px; }
        #layer-toggles input { width: 24px; height: 24px; flex: none; margin: 0 10px 0 0; }
        #zone-filter { display: flex; align-items: center; gap: 8px; }
        #day-zones summary { display: flex; align-items: center; }
        #day-zones button { min-height: 44px; }
        .maplibregl-ctrl-group button { width: 44px; height: 44px; }
        .maplibregl-ctrl-attrib-button { width: 44px; height: 44px; }
      }

      /* Narrow screens: the map takes the space above a bottom panel that holds every control. */
      @media (max-width: 700px) {
        #app { display: flex; flex-direction: column; }
        #map { position: relative; inset: auto; flex: 1; min-height: 0; }
        #panel {
          position: static; flex: none; display: flex; flex-direction: column; max-height: 55vh;
          overflow-y: auto; pointer-events: auto; background: #fff; box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.25);
        }
        #panel-toggle { display: block; width: 100%; flex: none; font-weight: 600; }
        #controls, #curb-detail-host { display: flex; flex-direction: column; gap: 8px; padding: 8px 10px; }
        #curb-detail-host { padding: 0; }
        #panel[data-collapsed] #controls { display: none; }
        #controls > *, #legends > div, #curb-detail {
          position: static; transform: none; width: auto; max-height: none; box-sizing: border-box;
          background: #f6f6f6; box-shadow: none;
        }
        #curb-detail { padding: 8px 10px; background: #fff; border-bottom: 1px solid #ddd; overflow-y: visible; }
        #day-zones ul { max-height: 30vh; }
        #legends { align-items: stretch; max-height: none; overflow: visible; padding: 0; background: none; }
        #time-controls .time-readout { font-size: 16px; }
        #time-controls .day-picker button { padding: 0; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <div id="panel">
        <button id="panel-toggle" type="button" aria-controls="controls" aria-expanded="true">Hide controls</button>
        <div id="curb-detail-host"></div>
        <div id="controls"><div id="legends"></div></div>
      </div>
    </div>
    <!-- Permanent reference label and data date (M5-2). The label is plain HTML so it shows even if the data fails to load. -->
    <footer id="reference-note">
      <strong>Reference tool only. Not the official source for citations.</strong>
      <span id="data-updated" hidden></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
