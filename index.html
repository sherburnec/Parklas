<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curb &amp; Zoning Map</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; }
      #app { flex: 1; min-height: 0; }
      #data-banner {
        padding: 6px 12px; text-align: center;
        font: 600 14px system-ui, sans-serif; color: #5c3b00; background: #ffd966;
      }
      #app { position: relative; }
      #zoning-legend, #timed-parking-legend {
        position: absolute; left: 10px; bottom: 28px; z-index: 1; padding: 6px 10px;
        font: 12px system-ui, sans-serif; background: rgba(255, 255, 255, 0.92); border-radius: 4px;
      }
      #timed-parking-legend { left: auto; right: 10px; }
      #layer-toggles {
        position: absolute; left: 10px; top: 10px; z-index: 1; margin: 0; padding: 6px 10px;
        font: 12px system-ui, sans-serif; background: rgba(255, 255, 255, 0.92); border: 0; border-radius: 4px;
      }
      #layer-toggles legend { padding: 0; font-weight: 600; }
      #layer-toggles label { display: block; cursor: pointer; }
      #layer-toggles input { margin: 0 6px 0 0; }
      #zone-filter {
        position: absolute; left: 10px; top: 190px; z-index: 1; padding: 6px 10px;
        font: 12px system-ui, sans-serif; background: rgba(255, 255, 255, 0.92); border-radius: 4px;
      }
      #time-controls {
        position: absolute; left: 50%; top: 10px; z-index: 1; transform: translateX(-50%);
        width: min(440px, calc(100% - 20px)); box-sizing: border-box; padding: 8px 10px;
        font: 12px system-ui, sans-serif; background: rgba(255, 255, 255, 0.95); border-radius: 4px;
      }
      #time-controls .time-readout { display: block; margin-bottom: 6px; font: 600 18px system-ui, sans-serif; }
      #time-controls .day-picker { display: flex; gap: 2px; margin-bottom: 6px; }
      #time-controls .day-picker button { flex: 1; padding: 4px 0; }
      #time-controls button[aria-pressed="true"] { background: #1a73e8; color: #fff; border-color: #1a73e8; }
      #time-controls .time-row { display: flex; align-items: center; gap: 8px; }
      #time-controls .time-row input[type="range"] { flex: 1; min-width: 0; }
      #curb-detail {
        position: absolute; right: 10px; top: 110px; z-index: 2; box-sizing: border-box; padding: 8px 12px;
        width: min(340px, calc(100% - 20px)); max-height: calc(100% - 200px); overflow-y: auto;
        font: 12px system-ui, sans-serif; background: rgba(255, 255, 255, 0.97); border-radius: 4px;
      }
      #curb-detail[hidden] { display: none; }
      #curb-detail h2 { margin: 6px 0 2px; font-size: 16px; }
      #curb-detail h3 { margin: 10px 0 2px; font-size: 13px; }
      #curb-detail p { margin: 2px 0; }
      #curb-detail ul { margin: 4px 0 0; padding: 0; list-style: none; }
      #curb-detail .curb-rule { margin: 4px 0; padding: 4px 6px; border-left: 4px solid #bbb; background: #f6f6f6; }
      #curb-detail .curb-rule.active { border-left-color: #1a73e8; background: #e8f0fe; }
      #curb-detail .curb-note { color: #555; }
      #curb-detail .curb-unmapped { font-weight: 600; }
      #day-zones {
        position: absolute; left: 50%; bottom: 28px; z-index: 1; transform: translateX(-50%); box-sizing: border-box; padding: 6px 10px;
        width: min(300px, calc(100% - 20px)); font: 12px system-ui, sans-serif;
        background: rgba(255, 255, 255, 0.95); border-radius: 4px;
      }
      #day-zones summary { cursor: pointer; font-weight: 600; }
      #day-zones ul { margin: 6px 0 0; padding: 0; list-style: none; max-height: 40vh; overflow-y: auto; }
      #day-zones button {
        display: block; width: 100%; padding: 4px 6px; text-align: left; font: inherit; cursor: pointer;
        background: none; border: 0; border-bottom: 1px solid #ddd;
      }
      #day-zones button:hover { background: #e8f0fe; }
      #day-zones button span { display: block; color: #555; }
      #permit-zones-legend {
        position: absolute; left: 10px; top: 190px; z-index: 1; padding: 6px 10px;
        font: 12px system-ui, sans-serif; background: rgba(255, 255, 255, 0.92); border-radius: 4px;
      }
      #permit-zones-legend .swatch {
        display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px;
        border: 1px solid rgba(0, 0, 0, 0.3);
      }
      #zoning-legend .swatch, #timed-parking-legend .swatch {
        display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px;
        border: 1px solid rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
